[project]
name = "text-watermark-pdf-doc"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = ["pikepdf==10.1.0", "reportlab==4.4.7"]

[project.scripts]
watermark = "watermark:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.uv]
package = true
